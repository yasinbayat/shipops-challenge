apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shipops-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yasinbayat/shipops-challenge.git
    targetRevision: main
    path: charts/shipops-api
  destination:
    server: https://kubernetes.default.svc
    namespace: shipops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
