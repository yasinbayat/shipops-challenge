replicaCount: 2

image:
  repository: ghcr.io/yasinbayat/shipops-api
  tag: "7556485"
  pullPolicy: IfNotPresent

appVersion: "7556485"

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

dbSecretName: shipops-db-secret

postgres:
  enabled: true
  image: postgres:16-alpine
  storageSize: 1Gi
